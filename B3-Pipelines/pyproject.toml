[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-pipelines"
version = "0.1.0"
description = "Pipeline de dados históricos da B3 com DuckDB e Parquet"
requires-python = ">=3.10"
dependencies = [
    "duckdb==2.0.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow==3.3.1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "main", "run_sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "historical_series*", "utils*"]

[tool.pyright]
extraPaths = ["src"]