x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL:-http://airflow-api-server:8080/execution/}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?Set AIRFLOW__API_AUTH__JWT_SECRET in .env}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@postgres/airflow
  AIRFLOW__TRACES__OTEL_ON: "true"
  AIRFLOW__TRACES__OTEL_APPLICATION: b3-pipelines
  AIRFLOW__METRICS__OTEL_ON: "true"
  AIRFLOW__METRICS__OTEL_PREFIX: b3_airflow
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
  OTEL_TRACES_EXPORTER: otlp_proto_http
  OTEL_SERVICE_NAME: b3-pipelines-airflow
  B3_DATA_LAKE_ROOT: /data-lake
  DUCKDB_HOST: ${DUCKDB_HOST:-duckdb-server}
  DUCKDB_PORT: ${DUCKDB_PORT:-9494}
  QUACK_TOKEN: ${QUACK_TOKEN:?Set QUACK_TOKEN in .env}
  PYTHONPATH: /opt/airflow/src

x-airflow-common: &airflow-common
  image: b3-airflow:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE:-apache/airflow:3.3.1-python3.12}
  env_file:
    - .env
  environment: *airflow-environment
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ${B3_DATA_LAKE_ROOT:?Set B3_DATA_LAKE_ROOT in .env}:/data-lake
    - ./airflow/dags:/opt/airflow/dags
    - airflow-task-logs:/opt/airflow/logs
  networks:
    - airflow_network
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network
    restart: unless-stopped

  duckdb-server:
    image: b3-duckdb-server:local
    build:
      context: .
      dockerfile: duckdb-server/Dockerfile
      args:
        DUCKDB_BASE_IMAGE: ${DUCKDB_BASE_IMAGE:-python:3.15-slim}
    environment:
      DUCKDB_HOST: 0.0.0.0
      DUCKDB_PORT: ${DUCKDB_PORT:-9494}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-8GB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-4}
      QUACK_TOKEN: ${QUACK_TOKEN:?Set QUACK_TOKEN in .env}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ${B3_DATA_LAKE_ROOT:?Set B3_DATA_LAKE_ROOT in .env}:/data-lake
    expose:
      - "${DUCKDB_PORT:-9494}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,socket; s=socket.create_connection(('127.0.0.1', int(os.environ['DUCKDB_PORT'])), timeout=2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - airflow_network
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    expose:
      - "4317"
      - "4318"
      - "3100"
      - "9090"
    volumes:
      - ./observability/prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      - observability-data:/data
    networks:
      - airflow_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - --housekeeping_interval=5s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - airflow_network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - airflow-task-logs:/var/lib/airflow/logs:ro
    depends_on:
      otel-lgtm:
        condition: service_healthy
    networks:
      - airflow_network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    restart: "no"
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      duckdb-server:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      duckdb-server:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

volumes:
  postgres-db-volume:
  observability-data:
  alloy-data:
  airflow-task-logs:

networks:
  airflow_network:
    driver: bridge
    name: ${B3_DOCKER_NETWORK:-b3-pipelines_airflow_network}
