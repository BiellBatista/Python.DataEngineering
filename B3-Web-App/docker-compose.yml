services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      B3_DATA_LAKE_ROOT: /data-lake
      B3_GOLD_CANDLES_DIR: ${B3_GOLD_CANDLES_DIR:-/data-lake/gold/candles}
      DUCKDB_HOST: ${DUCKDB_HOST:-duckdb-server}
      DUCKDB_PORT: ${DUCKDB_PORT:-9494}
      QUACK_TOKEN: ${QUACK_TOKEN:?Configure QUACK_TOKEN em .env}
      MAX_QUERY_ROWS: ${MAX_QUERY_ROWS:-1000}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-b3-web-app-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:8000"
    volumes:
      - type: bind
        source: ${B3_DATA_LAKE_ROOT:?Configure B3_DATA_LAKE_ROOT em .env}
        target: /data-lake
        read_only: true
    networks:
      - b3_pipelines
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  b3_pipelines:
    external: true
    name: ${B3_DOCKER_NETWORK:-b3-pipelines_airflow_network}
